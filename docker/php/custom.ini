[PHP]
; Increase PHP limits for AI processing
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 50M
post_max_size = 50M

; Session configuration
session.gc_maxlifetime = 86400

; Error reporting
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php-errors.log

; Performance
realpath_cache_size = 256k
realpath_cache_ttl = 600

; Allow extended functions needed for AI
disable_functions =
